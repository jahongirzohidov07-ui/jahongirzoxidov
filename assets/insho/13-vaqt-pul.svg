<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img" aria-label="Chizma: boshida sarflagan vaqt va kuch ko'p, topilgan pul kam; vaqt o'tib ikkalasi tenglashadi; natijalar ko'paygan sari pul sarflangan vaqtdan ko'p bo'ladi" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Chizma: boshida sarflagan vaqt va kuch ko'p, topilgan pul kam; vaqt o'tib ikkalasi tenglashadi; natijalar ko'paygan sari pul sarflangan vaqtdan ko'p bo'ladi</title>
