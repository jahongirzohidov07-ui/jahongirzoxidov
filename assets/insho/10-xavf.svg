ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#55503F" text-anchor="start" >«Osmonda juda qo'rqinchli»</text></g><g class="pop" style="transition-delay:1.00s"><line x1="350" y1="204" x2="602" y2="204" stroke="#C9BFA8" stroke-width="1.5"/><text x="350" y="226" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#4F7A43" text-anchor="start" >Faktlar:</text><text x="476" y="262" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#4F7A43" text-anchor="middle" >13,7 mln dan 1</text><text x="476" y="286" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#262019" text-anchor="middle" >bitta parvozda halok</text><text x="476" y="304" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#262019" text-anchor="middle" >bo'lish ehtimoli</text><text x="476" y="322" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#8A8170" text-anchor="middle" >dunyo, 2018-2022, MIT</text></g><g class="pop" style="transition-delay:1.50s"><text x="320" y="362" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#262019" text-anchor="middle" >Hislar bir narsani, faktlar boshqasini aytadi</text></g></svg>
