<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Boshqaruv paneli — Jahongir Zoxidov</title>
<meta name="theme-color" content="#EDE7D9">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%233B4A6B'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='38' font-weight='bold' fill='%23EDE7D9' text-anchor='middle'%3EJ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Literata:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --parchment: #EDE7D9;
    --parchment-deep: #E4DCC9;
    --ink: #262019;
    --ink-soft: #55503F;
    --indigo: #3B4A6B;
    --clay-gold: #9C7A3C;
    --rule: #C9BFA8;
    --surface: #F5F1E6;
    --good: #4F7A5A;
    --bad: #A3513F;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--parchment); color: var(--ink); font-family: 'Literata', Georgia, serif; min-height: 100vh; }
  body {
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(156, 122, 60, 0.06), transparent),
      radial-gradient(ellipse 700px 400px at 100% 20%, rgba(59, 74, 107, 0.05), transparent);
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }

  .shell { max-width: 1080px; margin: 0 auto; padding: 40px 24px 80px; }

  .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; padding-bottom: 22px; border-bottom: 1px solid var(--rule); margin-bottom: 36px; flex-wrap: wrap; }
  .brand { font-family: 'Fraunces', serif; font-size: 28px; font-weight: 600; letter-spacing: -0.01em; }
  .brand small { display: block; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--clay-gold); margin-top: 6px; }
  .head-actions { display: flex; gap: 10px; font-family: 'Inter', sans-serif; font-size: 13px; }
  .btn { border: 1px solid var(--rule); background: var(--surface); color: var(--ink-soft); padding: 9px 14px; border-radius: 999px; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; }
  .btn:hover { border-color: var(--indigo); color: var(--indigo); }
  .btn.primary { background: var(--indigo); color: var(--parchment); border-color: var(--indigo); }

  h2 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 24px; margin: 0 0 18px; letter-spacing: -0.01em; }
  h2 small { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; color: var(--ink-soft); letter-spacing: 0.06em; text-transform: uppercase; margin-left: 12px; }
  section { margin-bottom: 52px; }

  /* Stat tiles */
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .tile { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 18px 20px; }
  .tile .v { font-family: 'Fraunces', serif; font-size: 40px; font-weight: 600; line-height: 1; color: var(--indigo); }
  .tile .l { font-family: 'Inter', sans-serif; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); margin-top: 10px; }

  /* Chart */
  .chart { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 18px 20px 12px; margin-top: 14px; }
  .chart svg { width: 100%; height: 140px; display: block; }
  .chart .lbl { display: flex; justify-content: space-between; font-family: 'Inter', sans-serif; font-size: 11px; color: var(--ink-soft); margin-top: 6px; }
  .chart rect { fill: var(--indigo); opacity: 0.85; }
  .chart rect:hover { opacity: 1; fill: var(--clay-gold); }

  /* Table */
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th { font-family: 'Inter', sans-serif; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); text-align: left; padding: 10px 10px; border-bottom: 1px solid var(--rule); font-weight: 600; cursor: pointer; user-select: none; }
  th.r, td.r { text-align: right; }
  td { padding: 12px 10px; border-bottom: 1px solid rgba(201, 191, 168, 0.5); vertical-align: middle; }
  td.folio { font-family: 'Fraunces', serif; color: var(--clay-gold); font-weight: 600; width: 44px; }
  td.title a:hover { color: var(--indigo); }
  td.date { font-family: 'Inter', sans-serif; font-size: 12.5px; color: var(--ink-soft); white-space: nowrap; }
  td.views { font-family: 'Inter', sans-serif; font-weight: 600; white-space: nowrap; width: 70px; }
  td.bar { width: 26%; }
  .barline { height: 8px; background: rgba(59, 74, 107, 0.12); border-radius: 4px; overflow: hidden; }
  .barline i { display: block; height: 100%; background: var(--indigo); border-radius: 4px; }

  /* Programs */
  .prog { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 22px 24px; margin-bottom: 16px; }
  .prog-h { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
  .prog-h h3 { margin: 0; font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600; }
  .prog-h .sub { font-family: 'Inter', sans-serif; font-size: 13px; color: var(--ink-soft); }
  .prog-note { font-family: 'Inter', sans-serif; font-size: 13px; color: var(--clay-gold); margin: -4px 0 14px; }
  .lessons { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; }
  .lesson { display: flex; align-items: center; gap: 12px; padding: 10px 6px; border-bottom: 1px solid rgba(201, 191, 168, 0.5); }
  .lesson .n { font-family: 'Fraunces', serif; font-weight: 600; color: var(--clay-gold); width: 28px; flex: none; }
  .lesson .t { flex: 1; font-size: 15px; line-height: 1.3; }
  .lesson .c { font-family: 'Inter', sans-serif; font-size: 11px; color: var(--ink-soft); white-space: nowrap; }
  .lesson a.open { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; color: var(--parchment); background: var(--indigo); padding: 6px 12px; border-radius: 999px; white-space: nowrap; }
  .lesson a.open:hover { background: var(--clay-gold); }
  .lesson a.sk { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 700; color: var(--indigo); border: 1px solid var(--indigo); padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
  .lesson a.sk:hover { background: var(--indigo); color: var(--parchment); }
  .lesson.off .t { color: var(--ink-soft); }
  .lesson .soon { font-family: 'Inter', sans-serif; font-size: 11px; color: var(--ink-soft); border: 1px dashed var(--rule); padding: 5px 10px; border-radius: 999px; white-space: nowrap; }

  .empty, .err { font-family: 'Inter', sans-serif; font-size: 14px; color: var(--ink-soft); padding: 18px; background: var(--surface); border: 1px dashed var(--rule); border-radius: 12px; }
  .err { color: var(--bad); }

  /* Gate */
  #gate { display: none; min-height: 70vh; place-items: center; }
  #gate.show { display: grid; }
  #gate form { width: 340px; text-align: center; font-family: 'Inter', sans-serif; }
  #gate .hint { color: var(--ink-soft); font-size: 14px; margin: 10px 0 22px; }
  #gate input { width: 100%; font-family: 'Inter', sans-serif; font-size: 26px; letter-spacing: 0.4em; text-align: center; padding: 12px; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; color: var(--ink); outline: none; }
  #gate input:focus { border-color: var(--indigo); }
  #gate button { margin-top: 14px; width: 100%; font-size: 15px; font-weight: 600; padding: 13px; border-radius: 12px; border: 0; background: var(--indigo); color: var(--parchment); }
  #gate .gerr { color: var(--bad); font-size: 13px; margin-top: 12px; min-height: 18px; }

  #app { display: none; }
  #app.show { display: block; }

  @media (max-width: 720px) {
    .tiles { grid-template-columns: 1fr 1fr; }
    .lessons { grid-template-columns: 1fr; }
    td.bar, th.bar { display: none; }
    td.date { display: none; } th.date { display: none; }
    .tile .v { font-size: 32px; }
  }
</style>
</head>
<body>
<div class="shell">

  <header class="head">
    <div class="brand">Jahongir Zoxidov<small>Boshqaruv paneli</small></div>
    <div class="head-actions">
      <a class="btn" href="/">Saytga →</a>
      <button class="btn" id="refreshBtn" type="button">Yangilash</button>
      <button class="btn" id="logoutBtn" type="button">Chiqish</button>
    </div>
  </header>

  <div id="gate">
    <form id="gateForm">
      <div class="brand" style="font-size:24px">Kirish</div>
      <div class="hint">Bu sahifa faqat sayt egasi uchun. PIN kiriting.</div>
      <input type="password" id="pinInput" inputmode="numeric" autocomplete="off" placeholder="••••••">
      <button type="submit">Kirish</button>
      <div class="gerr" id="gateErr"></div>
    </form>
  </div>

  <div id="app">

    <section id="statsSec">
      <h2>O'qilganlar <small id="statsDate"></small></h2>
      <div class="tiles">
        <div class="tile"><div class="v" id="tTotal">–</div><div class="l">Jami o'qilgan</div></div>
        <div class="tile"><div class="v" id="tToday">–</div><div class="l">Bugun</div></div>
        <div class="tile"><div class="v" id="t7">–</div><div class="l">Oxirgi 7 kun</div></div>
        <div class="tile"><div class="v" id="t30">–</div><div class="l">Oxirgi 30 kun</div></div>
      </div>
      <div class="chart">
        <svg id="chart" viewBox="0 0 600 140" preserveAspectRatio="none"></svg>
        <div class="lbl"><span id="chartFrom"></span><span>kunlik o'qilganlar, oxirgi 30 kun</span><span id="chartTo"></span></div>
      </div>
      <div class="err" id="statsErr" style="display:none;margin-top:14px"></div>
    </section>

    <section>
      <h2>Insholar <small id="essayCount"></small></h2>
      <table id="essayTable">
        <thead><tr>
          <th data-sort="folio">№</th>
          <th data-sort="title">Sarlavha</th>
          <th class="date" data-sort="date">Sana</th>
          <th class="r" data-sort="views">O'qilgan ↓</th>
          <th class="bar"></th>
        </tr></thead>
        <tbody id="essayBody"></tbody>
      </table>
    </section>

    <section>
      <h2>Dasturlarim <small>animatsion slaydlar</small></h2>
      <div id="programs"><div class="empty">Yuklanmoqda…</div></div>
    </section>

  </div>
</div>

<script src="essays.js"></script>
<script>
(function () {
  const gate = document.getElementById('gate');
  const app = document.getElementById('app');
  const essays = (window.ESSAYS || []).map(e => ({ folio: String(e.folio), title: e.title, date: e.date || '' }));
  let stats = null;
  let sortKey = 'folio', sortDir = 1;

  function getPin() { try { return localStorage.getItem('jz_pin') || ''; } catch (e) { return ''; } }
  function setPin(v) { try { if (v) localStorage.setItem('jz_pin', v); else localStorage.removeItem('jz_pin'); } catch (e) {} }

  async function api(path) {
    const r = await fetch(path, { headers: { 'x-admin-pin': getPin() } });
    let j = null;
    try { j = await r.json(); } catch (e) {}
    if (r.status === 401 || r.status === 429) { const err = new Error((j && j.error) || 'PIN'); err.auth = true; throw err; }
    if (!r.ok) throw new Error((j && j.error) || ('Xatolik ' + r.status));
    return j;
  }

  function showGate(errText) {
    app.classList.remove('show');
    gate.classList.add('show');
    document.getElementById('gateErr').textContent = errText || '';
    document.getElementById('pinInput').focus();
  }

  document.getElementById('gateForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const v = document.getElementById('pinInput').value.trim();
    if (!v) return;
    setPin(v);
    document.getElementById('pinInput').value = '';
    boot();
  });
  document.getElementById('logoutBtn').addEventListener('click', () => { setPin(''); showGate(''); });
  document.getElementById('refreshBtn').addEventListener('click', () => boot());

  /* ---------- statistika ---------- */
  function dayKey(d) { return new Date(d.getTime() + 5 * 3600 * 1000).toISOString().slice(0, 10); }
  function fmtDate(k) { const [y, m, d] = k.split('-'); return d + '.' + m; }

  function renderStats() {
    const daily = stats.daily || {};
    const now = Date.now();
    const days = [];
    for (let i = 29; i >= 0; i--) days.push(dayKey(new Date(now - i * 86400000)));
    const vals = days.map(k => daily[k] || 0);
    const sum = (arr) => arr.reduce((a, b) => a + b, 0);
    document.getElementById('tTotal').textContent = stats.total || 0;
    document.getElementById('tToday').textContent = stats.today || 0;
    document.getElementById('t7').textContent = sum(vals.slice(-7));
    document.getElementById('t30').textContent = sum(vals);
    document.getElementById('statsDate').textContent = stats.date ? 'holat: ' + fmtDate(stats.date) : '';

    const svg = document.getElementById('chart');
    const max = Math.max(1, ...vals);
    const w = 600 / 30, pad = 2;
    svg.innerHTML = vals.map((v, i) => {
      const h = Math.max(v ? 4 : 1, (v / max) * 126);
      return '<rect x="' + (i * w + pad) + '" y="' + (134 - h) + '" width="' + (w - pad * 2) + '" height="' + h + '" rx="2"><title>' + fmtDate(days[i]) + ': ' + v + '</title></rect>';
    }).join('');
    document.getElementById('chartFrom').textContent = fmtDate(days[0]);
    document.getElementById('chartTo').textContent = fmtDate(days[29]);
  }

  function renderEssays() {
    const views = (stats && stats.views) || {};
    const rows = essays.map(e => ({ ...e, views: views[e.folio] || 0 }));
    const parseDate = (s) => { const p = s.split('.'); return p.length === 3 ? new Date(p[2], p[1] - 1, p[0]).getTime() : 0; };
    rows.sort((a, b) => {
      let x, y;
      if (sortKey === 'folio') { x = parseInt(a.folio, 10) || 0; y = parseInt(b.folio, 10) || 0; }
      else if (sortKey === 'views') { x = a.views; y = b.views; }
      else if (sortKey === 'date') { x = parseDate(a.date); y = parseDate(b.date); }
      else { x = a.title.toLowerCase(); y = b.title.toLowerCase(); return x < y ? -sortDir : x > y ? sortDir : 0; }
      return (x - y) * sortDir;
    });
    const max = Math.max(1, ...rows.map(r => r.views));
    document.getElementById('essayBody').innerHTML = rows.map(r => `
      <tr>
        <td class="folio">${r.folio}</td>
        <td class="title"><a href="/#insho-${encodeURIComponent(r.folio)}" target="_blank" rel="noopener">${esc(r.title)}</a></td>
        <td class="date">${esc(r.date)}</td>
        <td class="views r">${r.views}</td>
        <td class="bar"><div class="barline"><i style="width:${(r.views / max * 100).toFixed(1)}%"></i></div></td>
      </tr>`).join('');
    document.getElementById('essayCount').textContent = rows.length + ' ta insho';
    document.querySelectorAll('#essayTable th[data-sort]').forEach(th => {
      const base = th.textContent.replace(/[ ↓↑]+$/, '');
      th.textContent = th.dataset.sort === sortKey ? base + (sortDir > 0 ? ' ↑' : ' ↓') : base;
    });
  }
  document.querySelectorAll('#essayTable th[data-sort]').forEach(th => th.addEventListener('click', () => {
    const k = th.dataset.sort;
    if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = k === 'views' ? -1 : 1; }
    renderEssays();
  }));

  /* ---------- dasturlar ---------- */
  function renderPrograms(data) {
    const box = document.getElementById('programs');
    if (!data.programs || !data.programs.length) { box.innerHTML = '<div class="empty">Dasturlar hali qo\'shilmagan.</div>'; return; }
    box.innerHTML = data.programs.map(p => `
      <div class="prog">
        <div class="prog-h"><h3>${esc(p.title)}</h3><span class="sub">${esc(p.subtitle || '')} · ${p.lessons.length} dars</span></div>
        ${p.note ? '<div class="prog-note">' + esc(p.note) + '</div>' : ''}
        <div class="lessons">${p.lessons.map(l => `
          <div class="lesson ${l.ready ? '' : 'off'}">
            <span class="n">${l.n}</span>
            <span class="t">${esc(l.title)}${l.hint ? '<br><span class="c">' + esc(l.hint) + '</span>' : ''}</span>
            ${l.ready ? '<span class="c">' + l.slides + ' slayd</span>' + (l.script ? '<a class="sk" href="/skript?d=' + encodeURIComponent(p.id) + '&n=' + l.n + '" title="Skript: ma\'qul / izoh">📝 ' + l.script.ok + '/' + l.script.total + (l.script.izoh ? ' · ✎' + l.script.izoh : '') + '</a>' : '') + '<a class="open" href="/slayd?d=' + encodeURIComponent(p.id) + '&n=' + l.n + '">Ochish →</a>' : '<span class="soon">tayyorlanmoqda</span>'}
          </div>`).join('')}</div>
      </div>`).join('');
  }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  /* ---------- boshlash ---------- */
  async function boot() {
    if (!getPin()) { showGate(''); return; }
    gate.classList.remove('show');
    app.classList.add('show');
    const statsErr = document.getElementById('statsErr');
    statsErr.style.display = 'none';
    try {
      const [s, p] = await Promise.all([api('/api/stats').catch(e => { if (e.auth) throw e; return { _err: e.message }; }), api('/api/dastur')]);
      if (s._err) { stats = { views: {}, daily: {}, total: 0, today: 0 }; statsErr.textContent = 'Statistika olinmadi: ' + s._err; statsErr.style.display = 'block'; }
      else stats = s;
      renderStats();
      renderEssays();
      renderPrograms(p);
    } catch (e) {
      if (e.auth) { setPin(''); showGate(e.message === 'PIN' ? 'PIN noto\'g\'ri' : e.message); return; }
      statsErr.textContent = e.message; statsErr.style.display = 'block';
      renderEssays();
    }
  }
  boot();
})();
</script>
</body>
</html>
